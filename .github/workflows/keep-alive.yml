name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (app sleeps after ~12h idle)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright (uses the Chrome already on the runner)
        run: pip install playwright
      - name: Wake / verify app
        run: python scripts/keep_alive.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: keep-alive-failure
          path: keep-alive-failure.png
